[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trading-mcp"
version = "0.1.0"
description = "Servidor MCP de análise de mercado (forex e ações dos EUA) via MetaTrader 5 e SEC EDGAR"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2,<3",
    "MetaTrader5>=5.0.5; sys_platform == 'win32'",
    "pandas>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
    # zoneinfo (America/Sao_Paulo, America/New_York) não tem base de fusos própria no Windows.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
trading-mcp = "trading_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
